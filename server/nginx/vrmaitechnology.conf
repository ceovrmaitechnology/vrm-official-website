# ==============================================================================
# Nginx Configuration for vrmaitechnology.com
# Enforces guaranteed 1-hop 301 redirects and serves React prerendered SPA
# ==============================================================================

# 1. HTTP to HTTPS www (Guaranteed 1 hop 301)
server {
    listen 80;
    listen [::]:80;
    server_name vrmaitechnology.com www.vrmaitechnology.com;
    location ~* ^/products/aibuddy/?$ {
        return 301 https://www.vrmaitechnology.com/products/sibuddy;
    }
    return 301 https://www.vrmaitechnology.com$request_uri;
}

# 2. HTTPS non-www to HTTPS www (Guaranteed 1 hop 301)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vrmaitechnology.com;

    # SSL Certificates (managed by Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/vrmaitechnology.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vrmaitechnology.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location ~* ^/products/aibuddy/?$ {
        return 301 https://www.vrmaitechnology.com/products/sibuddy;
    }
    return 301 https://www.vrmaitechnology.com$request_uri;
}

# 3. Canonical HTTPS www server block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.vrmaitechnology.com;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/vrmaitechnology.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vrmaitechnology.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Root pointing to prerendered build directory
    root /var/www/vrm-official-website/build;
    index index.html;

    # 301 Product Renames (1-hop, no trailing slash)
    location ~* ^/products/aibuddy/?$ {
        return 301 https://www.vrmaitechnology.com/products/sibuddy;
    }

    # Strip trailing slash on all non-root paths (SEO 301 canonical in 1 hop)
    rewrite ^/(.+)/+$ https://www.vrmaitechnology.com/$1 permanent;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Explicit content-type for XML & TXT
    location = /sitemap.xml {
        default_type application/xml;
        try_files /sitemap.xml =404;
    }

    location = /robots.txt {
        default_type text/plain;
        try_files /robots.txt =404;
    }

    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|mp4)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # API Proxy to Node.js backend (if running pm2 on port 5000)
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # SPA and prerendered HTML resolution
    location / {
        try_files $uri $uri/ $uri/index.html /index.html =404;
    }

    # Custom 404 page
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
